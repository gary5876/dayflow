name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew build

  ocr-helper:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew ocrHelper

  pr-rules:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      BASE: ${{ github.base_ref }}
      HEAD: ${{ github.head_ref }}
      ADDITIONS: ${{ github.event.pull_request.additions }}
      DELETIONS: ${{ github.event.pull_request.deletions }}
    steps:
      - name: main takes pull requests only from develop
        run: |
          if [ "$BASE" = "main" ] && [ "$HEAD" != "develop" ]; then
            echo "::error::main은 develop에서만 PR을 받습니다. 대상 브랜치를 develop으로 바꾸세요."
            exit 1
          fi
      - name: Warn when a pull request is large
        run: |
          changed=$((ADDITIONS + DELETIONS))
          if [ "$BASE" != "main" ] && [ "$changed" -gt 400 ]; then
            echo "::warning::변경이 ${changed}줄입니다. 400줄을 넘으면 나눠서 올리는 것을 권합니다."
          fi
